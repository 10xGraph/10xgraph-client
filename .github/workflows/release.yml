name: Release

# Triggered by a version tag matching package.json, e.g.:
#   npm version 0.3.0 && git push --follow-tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Never release untested code: run the whole CI workflow against the tag first.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Verify tag and build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag version:     $TAG"
          echo "Package version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ($TAG) does not match package.json version ($PKG)."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: '*.tgz'

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: '*.tgz'
          fail_on_unmatched_files: true

  # Publishing to npm stays a deliberate manual step (`npm publish`), matching how
  # the Python packages are released. Uncomment to automate it, and set NPM_TOKEN.
  #
  # publish:
  #   needs: github-release
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     id-token: write   # required for provenance
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: '20'
  #         cache: npm
  #         registry-url: https://registry.npmjs.org
  #     - run: npm ci
  #     - run: npm run build
  #     - run: npm publish
  #       env:
  #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
